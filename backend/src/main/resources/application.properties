spring.application.name=ecommerce

# Server
server.port=8080

# Database connection (SQL Server)
# The username and password are read from environment variables,
# so no real password is saved in the code or on GitHub.
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=ECommerceDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME:ecommerce_app}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
# validate = Hibernate checks that the Java entities match the tables created by our SQL scripts.
# It never creates or changes tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
